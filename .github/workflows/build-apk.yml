name: بناء تطبيق كنوز (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: نسخ ملفات الموقع
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r icons www/

      - name: تثبيت Capacitor
        run: npm install

      - name: إنشاء مشروع أندرويد
        run: npx cap add android

      - name: مزامنة الملفات
        run: npx cap sync android

      - name: بناء الـ APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: kounouz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
