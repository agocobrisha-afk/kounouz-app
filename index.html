<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كنوز للخدمات السياحية</title>
<meta name="theme-color" content="#1F5A68">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كنوز">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Almarai:wght@400;700;800&family=Cairo:wght@400;600;800&family=El+Messiri:wght@500;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
 --primary:#1F5A68;--primary-soft:#2E7C8C;--dark:#12333B;--accent:#E8871E;
 --bg:#F7F4EF;--ink:#12333B;--muted:#6E8A92;--line:#E2E9EB;--tint:#DCEAED;
 --radius:18px;--font-body:"Tajawal";--font-display:"Almarai";--font-flourish:"Aref Ruqaa";
 --shadow:0 12px 40px -22px rgba(18,51,59,.5);--maxw:1120px;--gap:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body),system-ui,sans-serif;font-size:16px;line-height:1.75;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-display),sans-serif;line-height:1.35;margin:0}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:0}
img{max-width:100%;display:block}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}

header.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand img,.brand .mk{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:var(--primary);display:grid;place-items:center;color:#fff;font-family:var(--font-flourish),serif;font-size:17px}
.brand b{font-family:var(--font-display);font-weight:800;font-size:16px;display:block;line-height:1.2}
.brand span.sub{font-size:10px;color:var(--muted);letter-spacing:.09em}
nav.desk{display:none;gap:2px}
nav.desk a{padding:7px 12px;border-radius:99px;font-weight:500;font-size:14px;transition:.2s}
nav.desk a:hover{background:var(--tint)}
nav.desk a.on{background:var(--primary);color:#fff}
.iconbtn{background:var(--tint);color:var(--primary);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
@media(min-width:1100px){nav.desk{display:flex}.burger{display:none}}
.drawer{position:fixed;inset:0;z-index:80;background:rgba(18,51,59,.5);opacity:0;pointer-events:none;transition:.25s}
.drawer.open{opacity:1;pointer-events:auto}
.dpanel{position:absolute;inset-block:0;inset-inline-end:0;width:min(300px,84%);background:#fff;padding:20px;transform:translateX(-100%);transition:.28s;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.drawer.open .dpanel{transform:none}
.dpanel a{padding:12px 14px;border-radius:12px;font-weight:500}
.dpanel a.on{background:var(--primary);color:#fff}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:60px 0 66px;background:var(--dark)}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.hero-grad{position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,var(--dark) 0%,var(--primary) 55%,var(--primary-soft) 100%)}
.hero-glow{position:absolute;inset-inline-end:-80px;top:-100px;width:300px;height:300px;border-radius:50%;z-index:2;background:radial-gradient(circle,rgba(232,135,30,.3),transparent 68%)}
.hero .wrap{position:relative;z-index:4}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);padding:6px 15px;border-radius:99px;margin-bottom:18px}
.hero h1{font-size:clamp(28px,6.6vw,48px);font-weight:800;letter-spacing:-.5px}
.hero h1 em{font-family:var(--font-flourish),serif;font-style:normal;color:var(--accent);font-size:1.14em;padding-inline:4px}
.lede{font-size:clamp(15px,3.5vw,18px);max-width:540px;color:rgba(255,255,255,.86);margin:16px 0 26px;font-weight:300}
.hero-cta{display:flex;flex-wrap:wrap;gap:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:99px;font-weight:700;font-size:15.5px;transition:.2s;font-family:var(--font-display)}
.btn-accent{background:var(--accent);color:#3a2000}
.btn-accent:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-wa{background:#25D366;color:#06381b}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--primary)}

.page{display:none;animation:fade .28s ease}
.page.live{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{padding:var(--gap) 0}
.sec+.sec{padding-top:0}
.sec-head{margin-bottom:26px}
.sec-head.mid{text-align:center}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.17em;color:var(--accent);display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sec-head.mid .kicker{justify-content:center}
.kicker::before{content:"";height:1px;width:24px;background:var(--accent);opacity:.5}
.sec-head.mid .kicker::after{content:"";height:1px;width:24px;background:var(--accent);opacity:.5}
.sec-head h2{font-size:clamp(23px,4.8vw,32px);font-weight:800;letter-spacing:-.3px}
.sec-head p{color:var(--muted);margin:10px 0 0;max-width:560px;font-weight:300}
.sec-head.mid p{margin-inline:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}
@media(min-width:640px){.g2,.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}

/* ===== compact service circles ===== */
.svcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(min-width:560px){.svcgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.svcgrid{grid-template-columns:repeat(6,1fr)}}
.svc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:14px 6px;border-radius:16px;transition:.2s;background:#fff;border:1px solid var(--line)}
.svc:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.svc .circ{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.svc .circ svg{width:27px;height:27px;stroke:#fff;stroke-width:1.6;z-index:2}
.svc b{font-family:var(--font-display);font-size:13.5px;font-weight:800;line-height:1.4}
.svc small{font-size:11px;color:var(--accent);font-weight:700}

/* ===== carousel ===== */
.carou{position:relative}
.carou-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
.carou-track::-webkit-scrollbar{display:none}
.carou-item{flex:0 0 82%;scroll-snap-align:center;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
@media(min-width:700px){.carou-item{flex:0 0 44%}}
@media(min-width:1000px){.carou-item{flex:0 0 31%}}
.carou-item:hover{transform:translateY(-3px)}
.carou-item img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top}
.carou-cap{padding:13px 15px;display:flex;align-items:center;gap:10px}
.carou-cap b{font-family:var(--font-display);font-size:14.5px;flex:1}
.carou-cap .pr{font-family:var(--font-display);font-weight:800;color:var(--accent);font-size:16px}
.carou-nav{position:absolute;top:38%;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 16px rgba(0,0,0,.18);display:grid;place-items:center;z-index:5;color:var(--primary)}
.carou-nav.prev{inset-inline-start:-6px}
.carou-nav.next{inset-inline-end:-6px}
.carou-nav svg{width:20px;height:20px;stroke-width:2}

/* ===== country flags grid ===== */
.flags{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:640px){.flags{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.flags{grid-template-columns:repeat(6,1fr)}}
.flagcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;transition:.2s;box-shadow:var(--shadow)}
.flagcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.flagcard .fl{font-size:36px;line-height:1;margin-bottom:8px}
.flagcard b{display:block;font-family:var(--font-display);font-size:14px;font-weight:800}
.flagcard span{font-size:11.5px;color:var(--accent);font-weight:700}

/* ===== visa cards ===== */
.visa{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.visa-img{position:relative;background:var(--tint)}
.visa-img img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.visa-img .noimg{aspect-ratio:16/10;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,var(--primary-soft),var(--primary))}
.stamp{position:absolute;inset-inline-end:12px;top:12px;border:2px solid var(--accent);color:#fff;background:rgba(232,135,30,.92);border-radius:9px;padding:4px 10px;font-size:11px;font-weight:700;transform:rotate(-8deg);font-family:var(--font-display)}
.visa-head{padding:18px 20px 0}
.flagline{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.flagline em{font-style:normal;font-size:20px}
.visa-head h3{font-size:19px;font-weight:800;margin-top:3px}
.vrows{padding:12px 20px 0}
.vrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #F1F5F6;font-size:14px}
.vrow:last-child{border:0}
.vrow span{color:var(--muted);font-weight:300}
.vrow b{font-weight:700;font-family:var(--font-display);font-size:13.5px;text-align:end}
.docs{background:rgba(232,135,30,.08);border:1px solid rgba(232,135,30,.18);border-radius:12px;padding:12px 14px;margin:12px 20px 0}
.docs strong{font-size:12px;display:block;margin-bottom:5px;font-family:var(--font-display)}
.docs ul{margin:0;padding-inline-start:17px;font-size:13px;font-weight:300}
.visa-foot{padding:16px 20px 20px;margin-top:auto;display:flex;gap:9px;align-items:center}
.price{font-family:var(--font-display);font-weight:800;color:var(--primary);font-size:16.5px;margin-inline-end:auto}
.btn-sm{padding:9px 18px;border-radius:99px;font-size:13.5px;font-weight:700;font-family:var(--font-display);background:var(--primary);color:#fff;transition:.2s}
.btn-sm:hover{background:var(--dark)}
.alertbar{background:rgba(232,135,30,.09);border:1px solid rgba(232,135,30,.28);border-radius:14px;padding:14px 17px;font-size:14px;display:flex;gap:10px;margin-bottom:22px;font-weight:300}

/* ===== umrah detail ===== */
.upack{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}
.upack-img{width:100%;aspect-ratio:4/5;object-fit:contain;background:#0f2b33}
.upack-body{padding:22px}
.upack h3{font-size:22px;font-weight:800}
.hotels{display:grid;gap:12px;grid-template-columns:1fr;margin:16px 0}
@media(min-width:620px){.hotels{grid-template-columns:1fr 1fr}}
.hotelbox{background:var(--tint);border-radius:14px;padding:15px}
.hotelbox .city{font-size:11.5px;color:var(--primary);font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.hotelbox b{display:block;font-family:var(--font-display);font-size:17px;margin-top:5px}
.hotelbox .stars{color:var(--accent);font-size:13px;letter-spacing:2px}
.hotelbox small{color:var(--muted);font-size:12.5px}
.incl{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.incl span{background:var(--tint);color:var(--primary);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:500}
.priceband{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,var(--dark),var(--primary));color:#fff;border-radius:16px;padding:18px 20px;margin-top:18px}
.priceband .amt{font-family:var(--font-display);font-size:32px;font-weight:800;color:var(--accent);line-height:1}
.priceband small{color:rgba(255,255,255,.7);font-size:12.5px;display:block}
.priceband .acts{margin-inline-start:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ===== quiz ===== */
.quiz{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.qitem{padding:16px 0;border-bottom:1px solid var(--line)}
.qitem:last-of-type{border:0}
.qitem p{font-family:var(--font-display);font-weight:800;font-size:15.5px;margin:0 0 11px}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopt{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:8px 17px;font-size:14px;transition:.15s}
.qopt.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.scorebox{margin-top:20px;border-radius:16px;padding:22px;text-align:center;color:#fff}
.scorebox .pct{font-family:var(--font-display);font-size:46px;font-weight:800;line-height:1}
.scorebox h4{font-size:19px;margin:8px 0 6px}
.scorebox p{font-size:14px;opacity:.9;margin:0;font-weight:300}

/* ===== offers strip (flights/hotels) ===== */
.offstrip{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.offstrip{grid-template-columns:1fr 1fr}}
.offcard{position:relative;border-radius:var(--radius);overflow:hidden;min-height:170px;display:flex;align-items:flex-end;padding:22px;color:#fff;box-shadow:var(--shadow)}
.offcard .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.offcard .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(18,51,59,.25),rgba(18,51,59,.88))}
.offcard .inner{position:relative;z-index:2}
.offcard h3{font-size:20px;font-weight:800}
.offcard p{margin:5px 0 12px;font-size:14px;color:rgba(255,255,255,.85);font-weight:300}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:13.5px;display:flex;align-items:center;gap:7px}
.chip.taken{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.chip.taken i{background:#7FD4A0}

.field{margin-bottom:15px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;font-family:var(--font-display)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-soft);outline:none;box-shadow:0 0 0 3px var(--tint)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:24px 14px;text-align:center;color:var(--muted);font-size:13.5px;background:#FCFDFD}
.filelist{margin-top:9px;display:grid;gap:6px}
.fileitem{display:flex;gap:8px;background:var(--tint);padding:8px 12px;border-radius:10px;font-size:13px}
.btn-full{width:100%;background:var(--accent);color:#3a2000;padding:15px;border-radius:14px;font-weight:800;font-family:var(--font-display);font-size:16px}

.tstep{display:flex;gap:14px;position:relative;padding-bottom:24px}
.tstep::before{content:"";position:absolute;inset-inline-start:25px;top:52px;bottom:0;width:2px;background:var(--line)}
.tstep:last-child{padding-bottom:0}.tstep:last-child::before{display:none}
.tmark{width:52px;height:52px;flex:none;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:20px;color:var(--line);background:#fff}
.tstep.done .tmark{border:2px solid #2E8B57;color:#2E8B57;transform:rotate(-8deg);background:#F1F9F4}
.tstep.now .tmark{border:2px solid var(--accent);color:var(--accent);background:rgba(232,135,30,.1)}
.tstep h4{font-size:16px;font-weight:800;padding-top:7px}
.tstep p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.tstep.pending h4,.tstep.pending p{opacity:.42}

footer{background:var(--dark);color:rgba(255,255,255,.72);padding:44px 0 28px;margin-top:22px}
.fgrid{display:grid;gap:26px;grid-template-columns:1fr}
@media(min-width:760px){.fgrid{grid-template-columns:1.3fr 1fr 1fr}}
footer h4{color:#fff;font-size:15.5px;margin-bottom:12px;font-weight:800}
footer a{display:block;padding:4px 0;font-size:14px;font-weight:300}
footer a:hover{color:var(--accent)}
.fbot{border-top:1px solid rgba(255,255,255,.12);margin-top:28px;padding-top:16px;font-size:12.5px;text-align:center;color:rgba(255,255,255,.42)}
.wa{position:fixed;inset-inline-start:16px;bottom:16px;z-index:70;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px -6px rgba(37,211,102,.6)}
.wa svg{width:27px;height:27px;fill:currentColor;stroke:none}

.modal{position:fixed;inset:0;z-index:95;background:rgba(18,51,59,.72);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-in{background:#fff;width:min(560px,100%);border-radius:22px 22px 0 0;padding:26px;max-height:88vh;overflow:auto}
@media(min-width:640px){.modal{align-items:center}.modal-in{border-radius:22px}}
.lightbox{position:fixed;inset:0;z-index:99;background:rgba(10,25,30,.94);display:none;place-items:center;padding:16px}
.lightbox.open{display:grid}
.lightbox img{max-width:100%;max-height:88vh;border-radius:14px}

#adminApp{position:fixed;inset:0;z-index:100;background:#0D2429;color:#fff;display:none;flex-direction:column}
#adminApp.open{display:flex}
.ad-top{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.12);flex:none}
.ad-top b{font-family:var(--font-display);font-size:15.5px;margin-inline-end:auto}
.ad-tabs{display:flex;gap:5px;overflow-x:auto;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.1);flex:none}
.ad-tabs button{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);padding:7px 14px;border-radius:99px;font-size:13px;white-space:nowrap;font-weight:500}
.ad-tabs button.on{background:var(--accent);color:#3a2000;font-weight:700}
.ad-body{flex:1;overflow-y:auto;padding:16px 14px 92px}
.ad-sec{max-width:840px;margin:0 auto}
.ad-note{background:rgba(232,135,30,.12);border:1px solid rgba(232,135,30,.28);color:#F5B86A;border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.7}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:rgba(255,255,255,.75);font-family:var(--font-display)}
.fld input,.fld select,.fld textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#fff;padding:10px 12px;border-radius:11px;font-family:inherit;font-size:14px}
.fld input[type=color]{height:44px;padding:4px}
.fld input[type=range]{padding:0;accent-color:#E8871E}
.frow{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.frow.c2{grid-template-columns:1fr 1fr}.frow.c3{grid-template-columns:repeat(3,1fr)}}
.item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:15px;margin-bottom:11px}
.item.off{opacity:.45}
.item-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.item-h b{font-family:var(--font-display);font-size:14.5px;margin-inline-end:auto}

let quizAns={};
function renderQuiz(){
 const q=C.schengen.quiz;
 $('quizBox').innerHTML=q.map((item,qi)=>`<div class="qitem"><p>${qi+1}. ${esc(item.q)}</p>
  <div class="qopts">${item.o.map((o,oi)=>`<button class="qopt ${quizAns[qi]===oi?'sel':''}" onclick="pickQ(${qi},${oi})">${esc(o.t)}</button>`).join('')}</div></div>`).join('')
 +`<button class="btn btn-full" style="margin-top:18px" onclick="calcScore()">احسب فرصتي</button><div id="scoreOut"></div>`;
}
function pickQ(qi,oi){quizAns[qi]=oi;renderQuiz()}
function calcScore(){
 const q=C.schengen.quiz;
 if(Object.keys(quizAns).length<q.length){
  $('scoreOut').innerHTML=`<p style="text-align:center;color:var(--accent);font-size:14px;margin-top:12px">جاوب على كل الأسئلة الأول 🙂</p>`;return}
 let got=0,max=0;
 q.forEach((item,qi)=>{got+=item.o[quizAns[qi]].w;max+=Math.max(...item.o.map(o=>o.w))});
 const pct=Math.round(got/max*100);
 let bg,title,msg;
 if(pct>=75){bg='linear-gradient(135deg,#1F6146,#2E8B63)';title='فرصتك قوية';msg='ملفك مرتب وفرص القبول عالية. جهّز مستنداتك وابدأ الطلب.'}
 else if(pct>=50){bg='linear-gradient(135deg,#B0851C,#E8871E)';title='فرصتك متوسطة';msg='الملف مقبول بس محتاج تقوية — كلّمنا نساعدك تحسّن نقاط الضعف قبل التقديم.'}
 else{bg='linear-gradient(135deg,#8A3324,#C2571C)';title='فرصتك ضعيفة حالياً';msg='ننصحك تقوّي ملفك المالي والوظيفي الأول. كلّمنا ونرشدك للخطوات المناسبة.'}

let cur='home',navStack=['home'],historyOK=true;
function safeHistory(fn){if(!historyOK)return;try{fn()}catch(e){historyOK=false}}
function go(id,fromPop){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('live'));
 const t=$(id);if(t)t.classList.add('live');cur=id;markNav();window.scrollTo({top:0,behavior:'instant'});
 if(!fromPop){navStack.push(id);safeHistory(()=>history.pushState({page:id},'','#'+id))}
 renderBack();
}
window.addEventListener('popstate',e=>{go((e.state&&e.state.page)||'home',true)});
safeHistory(()=>history.replaceState({page:'home'},'',location.hash||'#home'));
function goBack(){
 if(historyOK){history.back();return}
 if(navStack.length>1){navStack.pop();go(navStack[navStack.length-1],true)}else go('home',true);
}
function renderBack(){
 const h=$('backHolder');if(!h)return;
 h.innerHTML=cur!=='home'?`<button class="iconbtn" onclick="goBack()" aria-label="رجوع">
  <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>`:'';
}

   ${prev?`<button class="mini del" onclick="setDeep('${path}','');renderAll();renderAdmin()">إزالة</button>`:''}

function pasteUrl(fid,path){
 const v=$(fid).value.trim();if(!v)return;
 if(!/^(https?:\/\/|\.\/)/.test(v)){alert('الرابط لازم يبدأ بـ http:// أو https://');return}
 setDeep(path,v);renderAll();renderAdmin();
}
async function upImg(inp,path){
 const f=inp.files[0];if(!f)return;
 const fld=inp.closest('.fld');const lab=fld?fld.querySelector('label'):null;const old=lab?lab.textContent:'';
 setDeep(path,URL.createObjectURL(f));renderAll();renderAdmin();
 if(lab)lab.textContent='⏳ جاري الرفع…';
 guardUnload(true);
 const {url,errMsg}=await uploadToStorage(f);
 guardUnload(false);
 if(lab)lab.textContent=old;
 if(!url){alert('فشل رفع الصورة:\n'+(errMsg||'')+'\n\nتقدر تستخدم خانة "الصق رابط صورة" بدلاً من كده.');return}
 setDeep(path,url);renderAll();renderAdmin();
}
function guardUnload(on){window.onbeforeunload=on?(()=>'في حفظ شغال — متقفلش الصفحة.'):null}
function setDeep(path,val){
 const parts=path.replace(/\[(\d+)\]/g,'.$1').split('.');
 const last=parts.pop();
 parts.reduce((o,k)=>o[k],C)[last]=val;
}

function exportJSON(){const blob=new Blob([JSON.stringify({config:C},null,2)],{type:'application/json'});

 rd.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.config)C=deepMerge(JSON.parse(JSON.stringify(DEFAULTS)),d.config);renderAll();renderAdmin();alert('تم الاستيراد')}catch(err){alert('الملف مش صالح')}};rd.readAsText(f)}

function deepMerge(base,over){
 if(Array.isArray(base))return Array.isArray(over)?over:base;
 if(base&&typeof base==='object'){const out={...base};
  for(const k in over){out[k]=(k in base)?deepMerge(base[k],over[k]):over[k]}return out}
 return over===undefined?base:over;
}
async function saveToCloud(){
 if(!sb)return{ok:false,errMsg:'مفيش اتصال بالسحابة'};
 try{const {error}=await sb.from('site_settings').upsert({id:1,config:C,updated_at:new Date().toISOString()});
  return{ok:!error,errMsg:error?(error.message||JSON.stringify(error)):''}}
 catch(e){return{ok:false,errMsg:(e&&e.message)||String(e)}}
}
async function uploadToStorage(file){
 if(!sb)return{url:null,errMsg:'مفيش اتصال بالسحابة'};
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
 const path=`${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
 const {error}=await sb.storage.from('branding').upload(path,file,{cacheControl:'3600',upsert:false});
 if(error)return{url:null,errMsg:error.message||JSON.stringify(error)};
 const {data}=sb.storage.from('branding').getPublicUrl(path);
 return{url:data.publicUrl,errMsg:''};
}
